<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1340" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>
    <linearGradient id="ingestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>
    <linearGradient id="retrieveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1c2128" />
    </linearGradient>
    <linearGradient id="safetyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1b1f" />
      <stop offset="100%" stop-color="#3d2127" />
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12261a" />
      <stop offset="100%" stop-color="#1f3a27" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3fb950" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d29922" />
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Title Section -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="800" height="60" rx="8" fill="url(#headerGrad)" />
    <text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Enverus Technical Case Study: End-to-End RAG Architecture</text>
    <text x="400" y="48" text-anchor="middle" font-size="13" fill="#e6edf3">Offline Document Ingestion &amp; Indexing → Live Grounded Retrieval &amp; Generation Pipeline</text>
  </g>

  <!-- Section 1: Offline Ingestion (Nodes 1 to 5) -->
  <g transform="translate(100, 115)">
    <!-- Stage Label -->
    <rect x="-30" y="-5" width="200" height="24" rx="12" fill="#1f6feb" opacity="0.2" />
    <text x="-20" y="12" font-size="11" font-weight="bold" fill="#58a6ff">OFFLINE INGESTION &amp; INDEXING</text>

    <!-- 1. PDF Document -->
    <g id="node-pdf" filter="url(#shadow)">
      <rect x="0" y="25" width="700" height="64" rx="8" fill="url(#ingestGrad)" stroke="#30363d" stroke-width="1.5" />
      <circle cx="36" cy="57" r="18" fill="#da3633" opacity="0.2" />
      <text x="36" y="62" text-anchor="middle" font-size="14" fill="#f85149" font-weight="bold">PDF</text>
      <text x="70" y="50" font-size="15" font-weight="bold" fill="#ffffff">Research Paper PDF: Agent-as-a-Judge</text>
      <text x="70" y="70" font-size="12" fill="#8b949e">data/agent_as_a_judge.pdf (Zhuge et al., 44 pages total, multi-column academic text, tables &amp; figures)</text>
    </g>

    <!-- Connector 1 -->
    <line x1="350" y1="89" x2="350" y2="114" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 2. Page Extraction -->
    <g id="node-extract" filter="url(#shadow)">
      <rect x="0" y="115" width="700" height="64" rx="8" fill="url(#ingestGrad)" stroke="#30363d" stroke-width="1.5" />
      <circle cx="36" cy="147" r="18" fill="#1f6feb" opacity="0.2" />
      <text x="36" y="152" text-anchor="middle" font-size="14" fill="#58a6ff" font-weight="bold">EXT</text>
      <text x="70" y="140" font-size="15" font-weight="bold" fill="#ffffff">Page-Level Extraction (src/ingest.py)</text>
      <text x="70" y="160" font-size="12" fill="#8b949e">PyMuPDF (fitz) text parsing • Extracts 44 PageRecord objects preserving 1-indexed page boundaries</text>
    </g>

    <!-- Connector 2 -->
    <line x1="350" y1="179" x2="350" y2="204" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 3. Structure-Aware Chunking -->
    <g id="node-chunking" filter="url(#shadow)">
      <rect x="0" y="205" width="700" height="68" rx="8" fill="url(#ingestGrad)" stroke="#30363d" stroke-width="1.5" />
      <circle cx="36" cy="239" r="18" fill="#8957e5" opacity="0.2" />
      <text x="36" y="244" text-anchor="middle" font-size="14" fill="#bc8cff" font-weight="bold">CHK</text>
      <text x="70" y="230" font-size="15" font-weight="bold" fill="#ffffff">Structure-Aware Document Chunking (src/chunking.py)</text>
      <text x="70" y="250" font-size="12" fill="#8b949e">134 deterministic Chunk objects (chunk_p{page}_{idx}) • Heading detection, Section attribution, Table integrity</text>
    </g>

    <!-- Connector 3 -->
    <line x1="350" y1="273" x2="350" y2="298" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 4. Embedding Model -->
    <g id="node-embedding" filter="url(#shadow)">
      <rect x="0" y="299" width="700" height="64" rx="8" fill="url(#ingestGrad)" stroke="#30363d" stroke-width="1.5" />
      <circle cx="36" cy="331" r="18" fill="#238636" opacity="0.2" />
      <text x="36" y="336" text-anchor="middle" font-size="14" fill="#3fb950" font-weight="bold">VEC</text>
      <text x="70" y="324" font-size="15" font-weight="bold" fill="#ffffff">Local Sentence-Transformers Embedding (src/embeddings.py)</text>
      <text x="70" y="344" font-size="12" fill="#8b949e">all-MiniLM-L6-v2 • 384-dimensional dense semantic vectors • Explicit L2 unit-norm normalization</text>
    </g>

    <!-- Connector 4 -->
    <line x1="350" y1="363" x2="350" y2="388" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 5. ChromaDB Vector Store -->
    <g id="node-chroma" filter="url(#shadow)">
      <rect x="0" y="389" width="700" height="68" rx="8" fill="url(#ingestGrad)" stroke="#1f6feb" stroke-width="2" />
      <circle cx="36" cy="423" r="18" fill="#1f6feb" opacity="0.25" />
      <text x="36" y="428" text-anchor="middle" font-size="14" fill="#58a6ff" font-weight="bold">DB</text>
      <text x="70" y="414" font-size="15" font-weight="bold" fill="#58a6ff">Persistent Vector Store (src/vector_store.py)</text>
      <text x="70" y="434" font-size="12" fill="#8b949e">ChromaDB collection: agent_as_a_judge (134 records) • HNSW indexing with Cosine Distance metric</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="50" y1="620" x2="850" y2="620" stroke="#30363d" stroke-dasharray="6 4" stroke-width="1.5" />

  <!-- Section 2: Online Query & RAG Generation (Nodes 6 to 11) -->
  <g transform="translate(100, 640)">
    <!-- Stage Label -->
    <rect x="-30" y="-5" width="220" height="24" rx="12" fill="#238636" opacity="0.2" />
    <text x="-20" y="12" font-size="11" font-weight="bold" fill="#3fb950">ONLINE QUERY &amp; GENERATION PIPELINE</text>

    <!-- 6. User Query -->
    <g id="node-query" filter="url(#shadow)">
      <rect x="0" y="25" width="700" height="60" rx="8" fill="url(#retrieveGrad)" stroke="#30363d" stroke-width="1.5" />
      <circle cx="36" cy="55" r="18" fill="#d29922" opacity="0.2" />
      <text x="36" y="60" text-anchor="middle" font-size="14" fill="#e3b341" font-weight="bold">USR</text>
      <text x="70" y="48" font-size="15" font-weight="bold" fill="#ffffff">User Query / Benchmark Question</text>
      <text x="70" y="68" font-size="12" fill="#8b949e">Validated natural language query (e.g. Q04: "Average cost and execution time of MetaGPT...")</text>
    </g>

    <!-- Connector 5 -->
    <line x1="350" y1="85" x2="350" y2="110" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 7. Dense Semantic Retrieval -->
    <g id="node-retrieval" filter="url(#shadow)">
      <rect x="0" y="111" width="700" height="68" rx="8" fill="url(#retrieveGrad)" stroke="#30363d" stroke-width="1.5" />
      <circle cx="36" cy="145" r="18" fill="#1f6feb" opacity="0.2" />
      <text x="36" y="150" text-anchor="middle" font-size="14" fill="#58a6ff" font-weight="bold">RET</text>
      <text x="70" y="136" font-size="15" font-weight="bold" fill="#ffffff">Dense Semantic Retrieval (src/retriever.py)</text>
      <text x="70" y="156" font-size="12" fill="#8b949e">Top-K Nearest Neighbor Cosine Search • Score = 1.0 - distance • Returns structured RetrievalResult list</text>
    </g>

    <!-- Connector 6 -->
    <line x1="350" y1="179" x2="350" y2="204" stroke="#d29922" stroke-width="2" marker-end="url(#arrowOrange)" />

    <!-- 8. Grounding & Safety Checks -->
    <g id="node-safety" filter="url(#shadow)">
      <rect x="0" y="205" width="700" height="88" rx="8" fill="url(#safetyGrad)" stroke="#f85149" stroke-width="2" />
      <circle cx="36" cy="249" r="18" fill="#da3633" opacity="0.3" />
      <text x="36" y="254" text-anchor="middle" font-size="14" fill="#f85149" font-weight="bold">SFT</text>
      <text x="70" y="230" font-size="15" font-weight="bold" fill="#f85149">Grounding, Table-Context &amp; Numerical Safety Layer (src/safety.py)</text>
      <text x="70" y="250" font-size="12" fill="#e6edf3">• Pre-Gen Entity Check: Early exit if specific requested identifiers (Task 51, R1) missing</text>
      <text x="70" y="268" font-size="12" fill="#e6edf3">• Table-Context Disambiguation: Detects divergent table contexts (Table 2 vs Table 3 substitution)</text>
      <text x="70" y="284" font-size="12" fill="#e6edf3">• Post-Gen Numerical Audit: Verifies all numbers/percentages strictly co-occur in evidence</text>
    </g>

    <!-- Branch Connector -->
    <line x1="350" y1="293" x2="350" y2="318" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)" />

    <!-- 9. Qwen 2.5 Local Generator -->
    <g id="node-generator" filter="url(#shadow)">
      <rect x="0" y="319" width="700" height="68" rx="8" fill="url(#retrieveGrad)" stroke="#30363d" stroke-width="1.5" />
      <circle cx="36" cy="353" r="18" fill="#8957e5" opacity="0.2" />
      <text x="36" y="358" text-anchor="middle" font-size="14" fill="#bc8cff" font-weight="bold">LLM</text>
      <text x="70" y="344" font-size="15" font-weight="bold" fill="#ffffff">Local LLM Generator (src/generator.py via Ollama)</text>
      <text x="70" y="364" font-size="12" fill="#8b949e">Qwen 2.5 1.5B (qwen2.5:1.5b) • Temperature: 0.0 • Strict 10-point anti-hallucination prompt contract</text>
    </g>

    <!-- Connector 7 -->
    <line x1="350" y1="387" x2="350" y2="412" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)" />

    <!-- 10. Validated Grounded Response -->
    <g id="node-response" filter="url(#shadow)">
      <rect x="0" y="413" width="700" height="74" rx="8" fill="url(#outputGrad)" stroke="#3fb950" stroke-width="2" />
      <circle cx="36" cy="450" r="18" fill="#238636" opacity="0.3" />
      <text x="36" y="455" text-anchor="middle" font-size="14" fill="#3fb950" font-weight="bold">OUT</text>
      <text x="70" y="438" font-size="15" font-weight="bold" fill="#3fb950">Validated Grounded Answer + Citations (RAGResponse)</text>
      <text x="70" y="458" font-size="12" fill="#ffffff">Deterministic Factual Answer OR Canonical Insufficiency Fallback ("The provided evidence is insufficient...")</text>
      <text x="70" y="474" font-size="12" fill="#8b949e">Full Provenance: Chunk IDs, 1-indexed pages, section titles, similarity scores, latency &amp; audit status</text>
    </g>
  </g>

  <!-- Footer Info -->
  <g transform="translate(100, 1260)">
    <rect x="0" y="0" width="700" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="350" y="24" text-anchor="middle" font-size="12" fill="#8b949e">Enverus Machine Learning &amp; Gen-AI Technical Case Study Submission • Fully Grounded &amp; Locally Hosted</text>
  </g>
</svg>
